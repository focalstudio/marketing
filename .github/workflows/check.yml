name: check

# Read-only: proves every key works and dumps Buffer's input schema. Posts nothing.
# `refresh` runs `refresh --dry-run`: it asks Meta how long the Threads and Instagram tokens
# would last after a refresh, discards the new token and changes no secret. The real refresh
# is refresh-tokens.yml.
on:
  workflow_dispatch:
    inputs:
      command:
        description: What to run
        type: choice
        options: [check, refresh, buffer-posts, styles]
        default: check

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/publish.mjs ${{ inputs.command == 'refresh' && 'refresh --dry-run' || inputs.command }}
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
