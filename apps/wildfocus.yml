# App-stream config for WildFocus. The renderer and the weekly drafter both read it.
name: WildFocus
repo: focalstudio/WildFocus
ref: dev
icon: ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png   # in `repo`; the end card's icon
concept: Disconnect. Chill, cozy, slow — the opposite of a feed.
mood: [calm, cozy, unhurried, warm]
style: low-poly 3D, soft paper lighting, pastel greens and sky blue
assets:
  backdrop: public/landscape.png        # portrait, already close to 9:16
  cast: src/assets/animals/*.png        # transparent PNGs, one per animal
  hero: src/assets/animals/rabbit.png
palette:
  accent: "#4a7c59"                     # sage, from src/theme.ts
  page: "#fafafa"
music: ambient, soft piano or lo-fi, no vocals, 60–80 bpm
video:
  aspect: "9:16"
  seconds: [15, 30]
cadence: 7 per week
rest_weeks: 4   # a unit may be reused this many weeks after it last posted (default 8)
# No `trust_from`: the weekly PR waits for a manual merge (delete a post's file to reject it).
# Add `trust_from: YYYY-MM-DD` to let it auto-merge from that date once tests and `publish.mjs plan` pass.
# `paused: true` is the kill switch: nothing is drafted and nothing auto-merges.
paused: false
days: [mon, tue, wed, thu, fri, sat, sun]    # posting days, UTC
time: "20:00"
# Video styles (video/STYLES.md). `appart`, which pastes the app's static animal PNGs, is retired since 2026-10-23: the
# renderer keeps it for posts already queued, and the clips below that need a timer, phone, sky or extra animals play in
# the drawn styles instead.
styles: [pixel, toon, lowpoly, ink, paper, storybook]
# Minimum posts per style each week, filled first by draft-week; what's left follows the usual rule. A style whose pool
# can't meet its minimum is reported by the drafter and the week still fills. Review with `publish.mjs styles`.
mix:
  pixel: 2
  paper: 2
  storybook: 2
# Copy per storyboard in video/clips/. hooks[i] pairs with titles[i]; a clip's hook rotates as it is reused. Hooks are the
# first line on screen (readable within a second); titles lead with what people search for and stay under 100 characters.
# `styles` limits a clip to the styles it renders in (default: the app's styles above).
clips:
  meditate:
    hooks:
      - Stop scrolling. Breathe. Sit still long enough and someone joins you.
      - A rabbit, a breeze, nowhere to be. Then a fox, a deer and a hedgehog sit down too.
      - Sit still for a minute. Watch who turns up.
    titles:
      - "Calm focus timer: stop scrolling and breathe | WildFocus"
      - "Relaxing cozy animation: a rabbit, a breeze, nowhere to be | WildFocus"
      - "Cozy meditation: sit still and someone turns up | WildFocus"
  collect:
    styles: [paper, storybook]
    hooks:
      - Every 25 minutes of focus, someone new moves in.
      - Focus for 25 minutes. Watch the meadow fill up.
      - Three timers, three new neighbours.
    titles:
      - "Pomodoro timer: every 25 minutes someone new moves in | WildFocus"
      - "25 minute focus timer that fills a meadow | WildFocus"
      - "Pomodoro timer, three focus sessions, three new neighbours | WildFocus"
  phone_down:
    styles: [paper, storybook]
    hooks:
      - They only come out when you put the phone down.
      - Phone down. Wait. Watch who shows up.
      - Pick the phone up and they all freeze.
    titles:
      - "Put your phone down: a focus timer for screen-free time | WildFocus"
      - "Phone down focus timer: wait and watch who shows up | WildFocus"
      - "Phone-free focus: pick it up and they all freeze | WildFocus"
  night_owls:
    styles: [paper, storybook]
    hooks:
      - Late night study session? You've got company.
      - Dusk, stars, an owl and a bat. Study with the night shift.
      - The sky goes dark, the stars come out, and you're not studying alone.
    titles:
      - "Study with me at night: a cozy late night study session | WildFocus"
      - "Study with me at night: dusk, stars, an owl and a bat | WildFocus"
      - "Late night study timer: you're not studying alone | WildFocus"
  rare_find:
    styles: [paper, storybook]
    hooks:
      - Seven days of focus. Then this showed up.
      - A week of focus and something rare shows up in the meadow.
      - Seven days in a row earns you something rare.
    titles:
      - "Focus streak reward: seven days of focus, then this showed up | WildFocus"
      - "7 day focus streak: something rare shows up in the meadow | WildFocus"
      - "Daily focus habit: seven days in a row | WildFocus"
  slow_lane:
    styles: [paper, storybook]
    hooks:
      - Nothing in this meadow is in a hurry. You don't have to be either.
      - Even the quick ones slow down here.
      - Slow is the point.
    titles:
      - "Slow living: nothing in this cozy meadow is in a hurry | WildFocus"
      - "Slow focus, cozy meadow: even the quick ones slow down | WildFocus"
      - "Slow is the point: a cozy focus timer | WildFocus"
  stay_awhile:
    styles: [paper, storybook]
    hooks:
      - Sit still for one session and the meadow comes to you.
      - You don't have to chase anything here. Stay awhile.
      - One 25-minute session. Three visitors. No rush.
    titles:
      - "Focus timer for calm: sit still and the meadow comes to you | WildFocus"
      - "Cozy focus app: nothing to chase, stay awhile | WildFocus"
      - "25 minute focus session: three visitors, no rush | WildFocus"
  short_break:
    styles: [paper, storybook]
    hooks:
      - Five minutes off, and the meadow keeps you company.
      - Take your break. Someone is already here.
      - Five minutes is enough for a proper break.
    titles:
      - "Pomodoro break timer: five minutes off, with company | WildFocus"
      - "Take a 5 minute break: someone is already here | WildFocus"
      - "5 minute break: five minutes is enough | WildFocus"
  leaf_fall:
    styles: [paper, storybook]
    hooks:
      - Leaves fall. The timer runs. Nobody minds.
      - A windy afternoon, a quiet timer and some company.
      - Let the leaves fall. You keep going.
    titles:
      - "Cozy autumn focus timer: let the leaves fall, keep going | WildFocus"
      - "Study with me in autumn: a quiet 25 minute timer | WildFocus"
      - "Pomodoro timer, autumn meadow: leaves fall and you keep going | WildFocus"
caption_cta: Free on iOS and Android.
links:
  app_store: https://apps.apple.com/us/app/pomodoro-timer-wild-focus/id6768295599
  play_store: TODO     # paste the Google Play URL
ai_label: false        # videos are drawn in code and rendered, and the voice reads a script: not AI-generated
