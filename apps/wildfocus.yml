# App-stream config for WildFocus. The renderer and the weekly drafter both read it.
name: WildFocus
repo: focalstudio/WildFocus
ref: dev
concept: Disconnect. Chill, cozy, slow — the opposite of a feed.
mood: [calm, cozy, unhurried, warm]
style: low-poly 3D, soft paper lighting, pastel greens and sky blue
assets:
  backdrop: public/landscape.png        # portrait, already close to 9:16
  cast: src/assets/animals/*.png        # transparent PNGs, one per animal
  hero: src/assets/animals/rabbit.png
palette:
  accent: "#4a7c59"                     # sage, from src/theme.ts
  page: "#fafafa"
music: ambient, soft piano or lo-fi, no vocals, 60–80 bpm
video:
  aspect: "9:16"
  seconds: [15, 30]
cadence: 3 per week
days: [mon, wed, fri]    # posting days, UTC
time: "20:00"
styles: [toon, lowpoly, pixel, ink]
# Copy per storyboard in video/clips/. hooks[i] pairs with titles[i]; a clip's hook rotates as it is reused.
# `styles` limits a clip to the styles it renders in (default: the app's styles above).
clips:
  meditate:
    hooks:
      - Stop scrolling. Breathe. Sit still long enough and someone joins you.
      - A rabbit, a breeze, nowhere to be. Then a fox, a deer and a hedgehog sit down too.
    titles:
      - "Stop scrolling. Breathe. | WildFocus"
      - "A rabbit, a breeze, nowhere to be | WildFocus"
caption_cta: Free on iOS and Android.
links:
  app_store: https://apps.apple.com/us/app/pomodoro-timer-wild-focus/id6768295599
  play_store: TODO     # paste the Google Play URL
ai_label: true         # set the platform's "AI-generated" flag where it exists
